name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and copy sources
        run: |
          flutter create --platforms=android --project-name obey_app --org com.example obey_app
          cp app_src/main.dart obey_app/lib/main.dart
          cp app_src/pubspec.yaml obey_app/pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' obey_app/android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        working-directory: obey_app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: obey-apk
          path: obey_app/build/app/outputs/flutter-apk/app-release.apk
